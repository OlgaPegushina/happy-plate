server:
  port: 9000
  forward-headers-strategy: framework

spring:
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 30
        initial-interval: 2000
        multiplier: 1.5
        max-interval: 10000

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:6541}/${POSTGRES_DB:delivery_db}?currentSchema=identity
    username: ${POSTGRES_USER:delivery_user}
    password: ${POSTGRES_PASSWORD:delivery_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: identity
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: identity
    default-schema: identity
    create-schemas: false
    table: flyway_schema_history_identity

jwt:
  issuer: happyplate-auth
  access-token-exp-minutes: 15
  refresh-token-exp-days: 7
  private-key: ${JWT_PRIVATE_KEY:classpath:keys/jwt-private.pem}
  public-key: ${JWT_PUBLIC_KEY:classpath:keys/jwt-public.pem}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # заставляем UI запрашивать спецификацию через Gateway
    config-url: /auth-service/v3/api-docs/swagger-config
    url: /auth-service/v3/api-docs

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info

app:
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}