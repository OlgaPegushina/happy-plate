server:
  port: 8083

spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:9000/.well-known/jwks.json

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info

internal:
  token: ${INTERNAL_TOKEN:dev-internal-secret}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include:
            - readinessState
            - rabbit