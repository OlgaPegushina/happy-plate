management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      validate-group-membership: false
      group:
        readiness:
          include:
            - readinessState

  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      export:
        enabled: false
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:app}
    password: ${RABBITMQ_PASSWORD:app_pass}
    listener:
      simple:
        default-requeue-rejected: false
        missing-queues-fatal: false
        declaration-retries: 60
        failed-declaration-retry-interval: 5000

  output:
    ansi:
      enabled: always