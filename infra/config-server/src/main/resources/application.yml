server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  output:
    ansi:
      enabled: always
  cloud:
    config:
      server:
        native:
          search-locations:
            - classpath:config/shared/
            - classpath:config/infra/
            - classpath:config/core/

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: "${spring.application.name}:${random.value}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never