services:
  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: infra/discovery-server
    ports:
      - "8761:8761"
    environment:
      - EUREKA_HOSTNAME=discovery-server
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8761/actuator/health/readiness" ]
      interval: 5s
      timeout: 3s
      retries: 30

  # --- Tracing ---
  zipkin:
    image: openzipkin/zipkin:2.27.0
    ports:
      - "9411:9411"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9411/health >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 30

  # --- Message Broker ---
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Database (PostgreSQL) ---
  postgres:
    image: postgres:16.1
    container_name: happy-plate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: delivery_pass
      POSTGRES_DB: delivery_db
    ports:
      - "6541:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # скрипты инициализации:
      - ./infra/postgres/init-database.sql:/docker-entrypoint-initdb.d/init-database.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery_user -d delivery_db"] # Проверка дефолтной БД
      interval: 5s
      timeout: 3s
      retries: 5

  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: infra/config-server
    ports:
      - "8888:8888"
    environment:
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30

  gateway-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: infra/gateway-server
    ports:
      - "8080:8080"
    environment:
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: unless-stopped

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: core/catalog-service
    ports:
      - "8081:8081"
    environment:
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

      # DB
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=delivery_db
      - POSTGRES_USER=delivery_user
      - POSTGRES_PASSWORD=delivery_pass

      # Rabbit
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest

      # JWT
      - JWT_SECRET=super-secret-key-change-in-prod-min-32-chars-long-string
      - JWT_EXPIRY_MS=3600000

    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness" ]
      interval: 5s
      timeout: 3s
      retries: 30

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: core/order-service
    ports:
      - "8082:8082"
    environment:
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

      # DB
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=delivery_db
      - POSTGRES_USER=delivery_user
      - POSTGRES_PASSWORD=delivery_pass

      # Rabbit
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest

    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness" ]
      interval: 5s
      timeout: 3s
      retries: 30

  delivery-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: core/delivery-service
    ports:
      - "8083:8083"
    environment:
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

      # Rabbit
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest

      # JWT (если shared yml требует)
      - JWT_SECRET=super-secret-key-change-in-prod-min-32-chars-long-string
      - JWT_EXPIRY_MS=3600000

    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8084/actuator/health/readiness" ]
      interval: 5s
      timeout: 3s
      retries: 30

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: core/payment-service
    ports:
      - "8084:8084"
    environment:
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

      # Rabbit
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest

      # JWT (если shared yml требует)
      - JWT_SECRET=super-secret-key-change-in-prod-min-32-chars-long-string
      - JWT_EXPIRY_MS=3600000

    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8083/actuator/health/readiness" ]
      interval: 5s
      timeout: 3s
      retries: 30

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: core/notification-service
    ports:
      - "8085:8085"
    environment:
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

      # Rabbit
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest

      # JWT (если shared yml требует)
      - JWT_SECRET=super-secret-key-change-in-prod-min-32-chars-long-string
      - JWT_EXPIRY_MS=3600000

    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8085/actuator/health/readiness" ]
      interval: 5s
      timeout: 3s
      retries: 30


