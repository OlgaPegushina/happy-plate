services:
  discovery-server:
    build: ./infra/discovery-server
    ports:
      - "8761:8761"
    environment:
      - EUREKA_HOSTNAME=discovery-server
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8761/actuator/health/readiness" ]
      interval: 5s
      timeout: 3s
      retries: 30

  # --- Tracing ---
  zipkin:
    image: openzipkin/zipkin:2.27.0
    ports:
      - "9411:9411"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9411/health >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 30

  # --- Message Broker ---
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Database (PostgreSQL) ---
  postgres:
    image: postgres:16.1
    container_name: happy-plate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: delivery_pass
      POSTGRES_DB: delivery_db
    ports:
      - "6541:5432"
 #   volumes:
 #     - pgdata:/var/lib/postgresql/data
      # скрипты инициализации:
 #     - ./infra/postgres/init-database.sql:/docker-entrypoint-initdb.d/init-database.sql
 #   healthcheck:
 #     test: ["CMD-SHELL", "pg_isready -U delivery_user -d delivery_db"] # Проверка дефолтной БД
 #     interval: 5s
 #     timeout: 3s
 #     retries: 5

  config-server:
    build: ./infra/config-server
    ports:
      - "8888:8888"
    environment:
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30

  gateway-server:
    build: ./infra/gateway-server
    ports:
      - "8080:8080"
    environment:
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: unless-stopped

